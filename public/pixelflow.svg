<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
<title>PixelFlow · 产品标志</title><desc>三个像素单元汇入成形的画幅。靛紫底板、瓷白像素和克制的边缘光。</desc>
<defs>
<linearGradient id="base" x1="48" y1="24" x2="207" y2="232" gradientUnits="userSpaceOnUse"><stop stop-color="#8F83FF"/><stop offset=".48" stop-color="#6D5CE8"/><stop offset="1" stop-color="#5041BB"/></linearGradient>
